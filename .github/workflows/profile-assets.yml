name: Notebook activity

on:
  schedule:
    # The previous UTC day is complete. 06:22 in Nepal.
    - cron: "37 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml
      - .github/scripts/**
      - design/requirements.txt
      - design/fonts/**

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'sakarkhadka10/sakarkhadka10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG typography tools
        run: python -m pip install -r design/requirements.txt

      - name: Refresh the commit journal and contribution graphs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/refresh-activity.py

      - name: Draw the notebook’s koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: sakarkhadka10
          body: asagi
          output-dir: assets/koi

      - name: Publish changed notebook activity
        shell: bash
        run: |
          set -euo pipefail
          git add assets/koi/koi.gif assets/activity.svg assets/activity-month.svg assets/activity-mobile.svg assets/activity-month-mobile.svg assets/activity.json
          if git diff --cached --quiet; then
            echo "The notebook activity is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh notebook activity and koi"
          git pull --rebase origin main
          git push origin HEAD:main
